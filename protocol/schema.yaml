# =============================================================================
# OpenClaw Teams bridge wire protocol - SINGLE SOURCE OF TRUTH
# =============================================================================
# One WebSocket per active Teams call. Peers exchange JSON text frames,
# camelCase keys, discriminated on the "type" field. Unknown fields are
# ignored and unknown message types degrade gracefully (older/newer peers
# interoperate), so all evolution must be additive.
#
# Directions:
#   worker_to_plugin  - the .NET media worker (standin-media-bridge) sends, the
#                       plugin (openclaw-msteams-bridge TS / hermes Python) receives
#   plugin_to_worker  - the plugin sends, the worker receives
#   both              - sent in both directions (audio.frame)
#
# This file is consumed by protocol/generate.py, which regenerates:
#   - C#      src/StandIn.MediaBridge/OpenClaw/Protocol.cs           (this repo)
#   - TS      src/protocol.gen.ts                               (openclaw-msteams-bridge)
#   - Python  hermes_msteams_bridge/protocol.py                 (hermes-msteams-bridge)
# The C# worker is the wire behavior of record; cross-language disagreements
# found while unifying the three hand-written copies are recorded in
# protocol/README.md (MISMATCHES) and preserved where they are receiver-side
# leniency rather than wire shape.
#
# Field attributes:
#   name       wire key (camelCase, exactly as serialized)
#   type       string | int | long | object:<TypeName> | array:<TypeName>
#   optional   may be omitted from the wire (C# emits nothing when null)
#   nullable   receiver also tolerates an explicit JSON null (TS .nullable())
#   default    wire default the receiver assumes when the field is omitted
#   enum       closed enum reference (validated by the TS receiver)
#   openEnum   documented well-known values, but any string is legal on the
#              wire (receivers must not reject unknown values)
#   pattern    regex the strict (TS) receiver enforces
#   tsCheck    extra Zod validation kept from the hand-written TS schema:
#              min1 | nonnegative | positive
#   pyDefault  lenient fallback the Python receiver substitutes when the
#              field is missing/blank (historical leniency, preserved)
#   doc        comment emitted into all three artifacts

protocol:
  name: openclaw-teams-bridge
  discriminator: type
  doc: "Wire protocol between the standin-media-bridge media worker and OpenClaw's voice-call msteams provider. One WebSocket per active Teams call. JSON-encoded discriminated union on the 'type' field."

constants:
  - name: PCM_SAMPLE_RATE_HZ
    value: 16000
    tsName: MSTEAMS_PCM_SAMPLE_RATE_HZ
    doc: "The Teams bridge wire format is PCM 16 kHz, 16-bit, mono in both directions. Single source of truth for the sample rate shared by the provider, realtime bridge, and TTS adapter."

enums:
  RecordingStatus:
    open: false
    tsTypeName: MsteamsRecordingStatus
    values: [active, inactive, unknown]
    doc: "Microsoft Teams recording status for the call. The bot must have called Graph updateRecordingStatus before media-derived data may be persisted; receivers gate persistence/processing on 'active'."
  CallDirection:
    open: false
    values: [inbound, outbound]
    doc: "'inbound' (caller dialed the bot) or 'outbound' (the bot placed this call, e.g. via /api/calls/place). Receivers default to inbound when absent."
  VideoFrameSource:
    open: false
    values: [camera, screenshare]
    doc: "Which inbound video stream a sampled frame came from."
  Emotion:
    open: true
    values: [neutral, happy, sad, surprised, thinking]
    doc: "Avatar emotion hint. Open set: receivers treat unknown values as neutral, so senders may emit values an older receiver does not know."
  DisplayImageMode:
    open: true
    values: [fullscreen, overlay]
    doc: "'fullscreen' replaces the bot's video tile; 'overlay' renders a PiP inset over the live avatar. The worker treats unknown/absent as fullscreen."
  DisplayFrameMime:
    open: true
    values: [image/jpeg]
    doc: "Encoding of a display.frame payload. Open set: senders send image/jpeg."

types:
  CallerInfo:
    doc: "Teams caller identity passed to the plugin on session start. All fields are nullable because Graph occasionally returns identities without one or more of these (guest, anonymous). Receivers coerce blank/whitespace strings to null so distinct anonymous callers never collide on an empty AAD id (cross-caller memory bleed guard)."
    fields:
      - name: aadId
        type: string
        optional: true
        nullable: true
        doc: "AAD object id of the caller, when known."
      - name: displayName
        type: string
        optional: true
        nullable: true
        doc: "Human-readable display name, when known."
      - name: tenantId
        type: string
        optional: true
        nullable: true
        doc: "AAD tenant id of the caller, when known."
  SpeechMark:
    doc: "One viseme mark: tMs milliseconds from utterance start, visemeId an Azure viseme id (0-21)."
    fields:
      - name: tMs
        type: long
        doc: "Time offset in ms, relative to the utterance/audio start."
      - name: visemeId
        type: int
        doc: "Azure viseme id, 0-21."

messages:
  # ---- worker -> plugin ------------------------------------------------------
  - type: session.start
    direction: worker_to_plugin
    csharp: SessionStartMessage
    python: SessionStart
    tsSchema: SessionStartSchema
    doc: "Sent once after WebSocket open. Carries call metadata + caller identity. recordingStatus is the Teams recording state at answer time; omitted when not yet known, in which case the worker reports it later via recording.status."
    fields:
      - name: callId
        type: string
        tsCheck: min1
        doc: "Graph call id; must match the HMAC-authenticated callId in the WebSocket URL path."
      - name: threadId
        type: string
        pyDefault: ""
        doc: "Teams chat thread id for the call. EMPTY on a 1:1 call, which has no meeting thread: the worker never substitutes the call id here (a call id in this field made the plugin POST minutes to a conversation that does not exist). Receivers MUST accept the empty string - a min-length check on this field rejected every 1:1 session.start and dropped the call to echo."
      - name: caller
        type: object:CallerInfo
        doc: "Caller identity (best-effort; see CallerInfo)."
      - name: recordingStatus
        type: string
        enum: RecordingStatus
        optional: true
        doc: "Teams recording status at answer time; omitted (null) when not yet known."
      - name: direction
        type: string
        enum: CallDirection
        optional: true
        doc: "Lets the plugin correlate calls it initiated. Defaults to inbound when absent."
      - name: tenantId
        type: string
        optional: true
        doc: "MANAGED only: the Microsoft tenant this call belongs to, so the plugin can post chat through the gateway during the call. Taken from the SIGNED route-grant scope, never a caller-supplied field - the plugin authorizes a chat send with it. Absent on BYO/free (one tenant, no gateway to post through)."

  - type: session.end
    # Bidirectional. worker -> plugin is the original: the worker tells the agent the call is over.
    # plugin -> worker is the teardown NOTICE an agent sends first ("time-limit",
    # "agent-disconnected", "agent-unavailable"): advisory, because the socket close that follows is
    # what actually ends the call, but it carries the only answer to "why did that call end" that the
    # worker cannot work out for itself. Both LiveKit bridges have always sent it; until the worker
    # grew a case for it, it deserialized cleanly and was discarded.
    direction: bidirectional
    csharp: SessionEndMessage
    python: SessionEnd
    tsSchema: SessionEndSchema
    tsType: SessionEndMessage
    doc: "Sent right before close. Reason is opaque text (e.g. 'call-ended', 'transport-failure')."
    fields:
      - name: reason
        type: string
        pyDefault: ""
        doc: "Opaque close reason text."

  - type: recording.status
    direction: worker_to_plugin
    csharp: RecordingStatusMessage
    python: RecordingStatus
    tsSchema: RecordingStatusMessageSchema
    doc: "Worker -> plugin. Reports the Microsoft Teams recording status for the call. The plugin gates persistence/processing of media-derived data on 'active' (Media Access API: the bot must have called Graph updateRecordingStatus before media-derived data may be persisted)."
    fields:
      - name: status
        type: string
        enum: RecordingStatus
        doc: "Current Teams recording status."

  - type: audio.frame
    direction: both
    csharp: AudioFrameMessage
    python: AudioFrame
    tsSchema: AudioFrameSchema
    tsType: AudioFrameMessage
    doc: "Bidirectional. Sender increments seq; receiver may use it to detect drops. payloadBase64 is the base64-encoded PCM16K (16kHz, 16-bit, mono, little-endian) audio bytes, usually one 20ms frame = 640 bytes raw = ~856 chars base64."
    fields:
      - name: seq
        type: long
        tsCheck: nonnegative
        doc: "Monotonic frame sequence number (per direction)."
      - name: timestampMs
        type: long
        tsCheck: nonnegative
        doc: "Frame timestamp in ms on the sender's audio timeline."
      - name: payloadBase64
        type: string
        doc: "Base64-encoded PCM16K bytes."
      - name: speakerName
        type: string
        optional: true
        doc: "Active speaker's display name when unmixed audio is on (additive; absent on the mixed path), so transcripts can carry real per-person attribution. Worker -> plugin only."

  - type: video.frame
    direction: worker_to_plugin
    csharp: VideoFrameMessage
    python: VideoFrame
    tsSchema: VideoFrameSchema
    doc: "Worker -> plugin. A sampled inbound video frame (caller camera or screen-share) as a base64 JPEG. Emitted sparsely, best-effort (dropped if the socket is busy). The plugin buffers the latest frame per source and feeds it to a vision model on demand."
    fields:
      - name: source
        type: string
        enum: VideoFrameSource
        doc: "'camera' | 'screenshare'."
      - name: ts
        type: long
        tsCheck: nonnegative
        doc: "Capture timestamp in ms."
      - name: width
        type: int
        tsCheck: positive
        doc: "Frame width in pixels (already downscaled worker-side)."
      - name: height
        type: int
        tsCheck: positive
        doc: "Frame height in pixels."
      - name: mime
        type: string
        tsCheck: min1
        pyDefault: image/jpeg
        doc: "Image MIME type; the worker sends 'image/jpeg'."
      - name: dataBase64
        type: string
        tsCheck: min1
        doc: "Base64-encoded image bytes."
      - name: participantId
        type: string
        optional: true
        tsCheck: min1
        doc: "Who this frame belongs to, so a vision model can reason about 'who is saying what' in a group call. For 'camera' the currently-subscribed speaker; for 'screenshare' the sharer. Best-effort: absent for anonymous/guest participants or when identity is unavailable."
      - name: participantName
        type: string
        optional: true
        tsCheck: min1
        doc: "Display name matching participantId. Best-effort."

  - type: participants
    direction: worker_to_plugin
    csharp: ParticipantsMessage
    python: Participants
    tsSchema: ParticipantsSchema
    doc: "Worker -> plugin. The number of human participants on the call (excludes the bot), sent at join and whenever the roster changes. Lets the plugin tell a 1:1 call (count <= 1) from a group/meeting (count >= 2) so it can stay quiet until addressed in groups."
    fields:
      - name: count
        type: int
        tsCheck: nonnegative
        doc: "Human participant count, excluding the bot."

  - type: dtmf
    direction: worker_to_plugin
    csharp: DtmfMessage
    python: Dtmf
    tsSchema: DtmfSchema
    doc: "Worker -> plugin. A DTMF key the caller pressed during the call (in-band tone detected by the media platform). The plugin surfaces it to the agent so it can drive IVR-style flows ('press 1 to...')."
    fields:
      - name: digit
        type: string
        pattern: "^[0-9*#]$"
        doc: "A single character: '0'-'9', '*', or '#'."

  - type: ping
    direction: worker_to_plugin
    csharp: PingMessage
    python: Ping
    tsSchema: PingSchema
    doc: "Worker -> plugin heartbeat (every 30s; keeps proxy/NAT idle timeouts from half-opening the socket). The plugin replies with pong."
    fields:
      - name: ts
        type: long
        tsCheck: nonnegative
        doc: "Sender's unix epoch ms."

  - type: assistant.say
    direction: worker_to_plugin
    csharp: AssistantSayMessage
    python: AssistantSay
    tsSchema: AssistantSaySchema
    doc: "Worker -> plugin (H4). Ask the agent to speak the given text in its OWN realtime voice before the worker tears the call down - e.g. a brief goodbye when a time/minute limit (free trial, daily budget, or the paid max-minutes governor) cuts the call off, instead of a bare mid-sentence hangup. The plugin injects the text into the realtime session and triggers a spoken response; in streaming/TTS mode it speaks via the existing TTS path, else it no-ops. Additive/best-effort: an older plugin ignores it."
    fields:
      - name: text
        type: string
        tsCheck: min1
        doc: "The exact utterance the agent should speak (a short goodbye)."

  # ---- plugin -> worker ------------------------------------------------------
  - type: assistant.cancel
    direction: plugin_to_worker
    csharp: AssistantCancelMessage
    python: AssistantCancel
    tsType: AssistantCancelMessage
    doc: "Plugin -> worker. Cancel the current TTS turn (barge-in). The worker flushes queued playback for audio received before this cancel."
    fields:
      - name: turnId
        type: long
        doc: "The assistant turn being cancelled (sender-scoped counter)."

  - type: expression
    direction: plugin_to_worker
    csharp: ExpressionMessage
    python: Expression
    tsType: ExpressionMessage
    doc: "Plugin -> worker. Hint the emotion the avatar should express on the bot's video tile. Additive and best-effort: a receiver that does not implement it ignores it; unknown values fall back to neutral. Affects only the video tile, never audio."
    fields:
      - name: emotion
        type: string
        openEnum: Emotion
        doc: "Emotion tag; see Emotion enum for well-known values."

  - type: speech.marks
    direction: plugin_to_worker
    csharp: SpeechMarksMessage
    python: SpeechMarks
    tsType: SpeechMarksMessage
    doc: "Plugin -> worker. Viseme timeline for one TTS utterance: each mark is a (tMs, visemeId) pair on the utterance's audio timeline, used to drive lip-sync. Additive/best-effort: a receiver that does not implement it ignores the message."
    fields:
      - name: ts
        type: long
        doc: "Reserved timeline anchor; senders currently send 0."
      - name: marks
        type: array:SpeechMark
        doc: "Viseme marks, ascending tMs."

  - type: display.image
    direction: plugin_to_worker
    csharp: DisplayImageMessage
    python: DisplayImage
    tsType: DisplayImageMessage
    doc: "Plugin -> worker. Show the caller an image on the bot's outbound video tile for a few seconds, then return to the avatar. Additive/best-effort: a receiver that does not implement it ignores it."
    fields:
      - name: dataBase64
        type: string
        doc: "Image bytes (JPEG/PNG per mime), base64-encoded."
      - name: mime
        type: string
        doc: "'image/jpeg' or 'image/png'."
      - name: durationMs
        type: int
        optional: true
        nullable: true
        doc: "How long to show the image; the worker applies its default when omitted/null or <= 0."
      - name: mode
        type: string
        openEnum: DisplayImageMode
        optional: true
        nullable: true
        doc: "'fullscreen' (replace the tile; worker default) or 'overlay' (PiP inset)."
      - name: ts
        type: long
        optional: true
        default: 0
        doc: "Reserved timeline anchor. The TS sender omits it, the Python sender sends 0; the worker defaults it to 0."
      - name: caption
        type: string
        optional: true
        nullable: true
        doc: "Optional short label drawn along the bottom of the image."

  - type: display.frame
    direction: plugin_to_worker
    csharp: DisplayFrameMessage
    python: DisplayFrame
    tsType: DisplayFrameMessage
    # published: false excludes this experimental type from the GENERATED portal
    # wire-surface table (generate.py emit_portal_surface). Messages default to
    # published; flip this (or remove it) at display.frame graduation to list it.
    published: false
    doc: "Plugin -> worker (experimental). One frame of a continuous avatar-video stream onto the bot tile, JPEG-compressed. Latest-wins: only the newest frame matters, and senders MUST drop (not buffer) frames under backpressure, like hot-path audio. No lifecycle handshake: the first frames start the stream, silence ends it. Additive/best-effort: older peers ignore it."
    fields:
      - name: seq
        type: long
        tsCheck: nonnegative
        doc: "Monotonic frame sequence number; out-of-order and duplicate frames are dropped."
      - name: ts
        type: long
        tsCheck: nonnegative
        doc: "Capture timestamp in ms on the SENDER's media timeline - the same timeline the sender stamps on its outbound audio.frame messages, so the video and audio streams carry one shared clock. Not a scheduling deadline."
      - name: mime
        type: string
        openEnum: DisplayFrameMime
        doc: "Frame encoding; senders send 'image/jpeg'."
      - name: dataBase64
        type: string
        doc: "Base64-encoded image bytes. Senders SHOULD keep frames small (target <= 40 KB raw per frame) and MUST drop rather than buffer under backpressure."
      - name: width
        type: int
        optional: true
        nullable: true
        doc: "Source pixel width (informational)."
      - name: height
        type: int
        optional: true
        nullable: true
        doc: "Source pixel height (informational)."

  - type: pong
    direction: plugin_to_worker
    csharp: PongMessage
    python: Pong
    tsType: PongMessage
    doc: "Plugin -> worker heartbeat response, echoing the ping timestamp."
    fields:
      - name: ts
        type: long
        doc: "Echoed ping timestamp (unix epoch ms)."
