name: Release

# Publishing is the one action in this repository that cannot be taken back:
# PyPI refuses a re-upload of a version that already exists, and an npm
# unpublish is a 72-hour window and a public record. So this workflow is built
# to be impossible to fire by accident, and there are three gates in front of
# every upload:
#
#   1. It runs only on a `v*` tag, or on a deliberate manual dispatch.
#   2. A manual dispatch is a DRY RUN unless somebody types `publish`.
#   3. Each upload job names a GitHub Environment. Configure both environments
#      with required reviewers, and the job waits for a human in the Actions UI
#      even after the tag is pushed. Without that setting the tag alone is
#      enough, which is the thing to decide once and then never think about.
#
# Every job builds first and verifies second. `make release-check` is the same
# script a developer runs locally, so a release that would fail here fails on
# the laptop instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload. Anything else builds and stops.'
        required: false
        default: "dry-run"
        type: string

permissions:
  contents: read

concurrency:
  # One release at a time. Two tags pushed together would otherwise race for
  # the same version on both registries.
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build both packages and check the versions agree
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # release_check.py asks git which tag points at HEAD, and a shallow
          # clone has no tags to answer with.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the workspace tools
        run: |
          python -m pip install uv==0.12.9
          npm install --global pnpm@11.20.0
      - name: Install both packages
        run: |
          cd libraries/python && uv sync --all-extras --frozen && cd -
          cd libraries/typescript && pnpm install --frozen-lockfile
      - name: Run every check, both languages
        run: make check
      - name: Build, and check the versions agree with the tag
        run: make release-check
      - name: Decide whether this run may upload
        id: decide
        run: |
          version="$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('libraries/python/standin/version.py').read_text()).group(1))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.confirm }}" = "publish" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run. Both packages built and verified; nothing was uploaded."
          fi
      - name: Pack the npm tarball too
        # Into the runner's own directory, not into libraries/typescript/dist:
        # that is the build output the package ships, and a tarball inside it
        # would end up inside the next tarball.
        run: cd libraries/typescript && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Keep both artifacts for inspection
        # So a dry run leaves something to look at, and a real release leaves a
        # record of exactly what was uploaded.
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.decide.outputs.version }}
          path: |
            libraries/python/dist/*
            ${{ runner.temp }}/*.tgz
          if-no-files-found: error

  pypi:
    name: Publish standin-sdk to PyPI
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      # Give this environment required reviewers in the repository settings.
      # That is what makes a pushed tag wait for a person rather than upload.
      name: pypi
      url: https://pypi.org/p/standin-sdk
    permissions:
      # Trusted publishing: PyPI verifies this run's OIDC identity, so there is
      # no API token in the repository to leak or rotate. Configure the
      # publisher on PyPI against this repository, this workflow and the `pypi`
      # environment before the first release.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheel and the sdist
        run: |
          python -m pip install uv==0.12.9
          cd libraries/python && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libraries/python/dist/

  npm:
    name: Publish @komaa/standin-sdk to npm
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@komaa/standin-sdk
    permissions:
      contents: read
      # Provenance: npm records which workflow, which commit and which tag
      # produced the tarball, and shows it on the package page. It costs one
      # permission and makes the supply chain checkable by anyone.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install and build
        run: |
          npm install --global pnpm@11.20.0
          cd libraries/typescript
          pnpm install --frozen-lockfile
          pnpm build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd libraries/typescript
          # --access public because the package is scoped, and a scoped package
          # defaults to restricted: the first publish would succeed and nobody
          # outside the organisation could install it.
          npm publish --access public --provenance
