name: SDK checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workspace tools
        run: |
          python -m pip install uv==0.12.9
          npm install --global pnpm@11.20.0
      - name: Check generated protocols
        run: make protocol-check
      - name: Install Python packages
        working-directory: libraries/python
        run: uv sync --all-extras --frozen
      - name: Install TypeScript packages
        working-directory: libraries/typescript
        run: pnpm install --frozen-lockfile
      - name: Run every check, both languages
        run: make check
